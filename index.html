<title>Pockey Earn</title>
<link rel="stylesheet" href="./styles.css?v=20261008-3">

html,body{min-height:100%;background:#07111f!important}

#app{min-height:100vh}
.boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px}
.boot-card{width:min(460px,100%);background:#0e1b2d;border:1px solid #2a3d58;border-radius:22px;padding:24px;box-shadow:0 15px 50px rgba(0,0,0,.25)}
.boot-title{font-size:30px;font-weight:900}.boot-title span{color:#7c6cff}
.boot-msg{color:#a8b6c9;font-size:14px;line-height:1.6}
</style>

<body>
<div id="app">
  <div class="boot-fallback">
    <div class="boot-card">
      <div class="boot-title">Pockey <span>Earn</span></div>
      <p class="boot-msg">Starting app…</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
